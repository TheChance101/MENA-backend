identity.privacy.policy.sections[0].title=ما هو لوريم إيبسوم؟
identity.privacy.policy.sections[0].content=هو مجرد نص وهمي يُستخدم في صناعات الطباعة وتنسيق النصوص. لقد كان لوريم إيبسوم النص الوهمي القياسي في هذه الصناعة منذ القرن السادس عشر (منذ عام 1500 تقريباً)، عندما أخذت مطبعة مجهولة مجموعة من المحارف وقامت بخلطها بشكل عشوائي لتكوين كتاب عينات من المحارف. لقد صمد هذا النص لأكثر من خمسة قرون.
