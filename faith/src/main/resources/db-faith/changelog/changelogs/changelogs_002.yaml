databaseChangeLog:
  - changeSet:
      id: 5-faith
      author: marwanqashwa
      comment: Create day_prayer_timings table in faith schema
      changes:
        - sql:
            drop table if exists faith.day_prayer_timings

        - sql:
            create table faith.day_prayer_timings
            (
            id                          integer generated by default as identity not null primary key,
            latitude                    double precision not null,
            longitude                   double precision not null,
            saved_in                    timestamp(6) with time zone not null,
            gregorian_date              varchar(255) not null,
            date_timestamp              varchar(255) not null,
            gregorian_readable_date     varchar(255) not null,
            gregorian_day               varchar(50) not null,
            gregorian_day_name          varchar(100) not null,
            gregorian_month             integer not null,
            gregorian_month_name        varchar(100) not null,
            gregorian_year              varchar(10) not null,
            hijri_date                  varchar(255) not null,
            hijri_readable_date         varchar(255) not null,
            hijri_day                   varchar(50) not null,
            hijri_day_name              varchar(100) not null,
            hijri_day_arabic_name       varchar(100) not null,
            hijri_month                 integer not null,
            hijri_year                  varchar(10) not null,
            hijri_month_name            varchar(100) not null,
            hijri_month_arabic_name     varchar(100) not null,
            fajr                        varchar(50) not null,
            sunrise                     varchar(50) not null,
            dhuhr                       varchar(50) not null,
            asr                         varchar(50) not null,
            maghrib                     varchar(50) not null,
            isha                        varchar(50) not null
            );
