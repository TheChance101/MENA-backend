databaseChangeLog:
  - changeSet:
      id: 6-wallet
      author: Joseph-Sameh-0
      comment: Add firstName, lastName, and imageUrl columns to wallet_user table
      changes:
        - addColumn:
            tableName: wallet_user
            schemaName: wallet
            columns:
              - column:
                  name: first_name
                  type: VARCHAR
                  defaultValue: ''
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR
                  defaultValue: ''
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR
                  constraints:
                    nullable: true
